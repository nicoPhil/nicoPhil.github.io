<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zone Grise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: one full-screen canvas for the raid; full-screen HTML panels for the stash, the bag and end-of-raid screens. */
:root{
  --ground:#15171a; --wall:#2d3238; --wall-top:#3d444c; --panel:#1d2024; --line:#353a41; --scrim:rgba(14,15,17,.93);
  --fg:#e7e3d8; --muted:#8e9094; --accent:#f2a33a; --accent-ink:#1c1306; --ok:#5fc27e; --bad:#e2574c; --enemy2:#e8833f;
  --r0:#a9abae; --r1:#6cc070; --r2:#4f9de8; --r3:#c784f2;
  --f-display:"Chakra Petch","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--f-display);font-weight:600;font-size:14px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:20px;letter-spacing:.1em;text-transform:uppercase;padding:16px}
.screen{position:fixed;inset:0;z-index:5;overflow-y:auto;touch-action:pan-y;background:var(--ground);
  padding-block:calc(env(safe-area-inset-top,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 32px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.over{background:var(--scrim)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:36px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);line-height:1}
h2{font-size:24px;letter-spacing:.04em}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cr{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm b{font-weight:600}
.nm small{color:var(--muted);font-size:13px}
.val{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.btns{display:flex;gap:6px}
.note{color:var(--muted);font-size:13px;margin:0}
.empty{color:var(--muted);padding:6px 0;margin:0}
#hud{position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-variant-numeric:tabular-nums;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hp{position:relative;flex:1;max-width:220px;height:18px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:3px;overflow:hidden}
#hpfill{position:absolute;inset:0 auto 0 0;background:var(--ok)}
#hptxt{position:relative;font-size:12px;padding-left:6px;line-height:18px}
#timer{font-size:20px;min-width:56px}
#timer.warn{color:var(--bad)}
#bagc{font-size:14px;color:var(--muted)}
#act{position:fixed;z-index:3;display:flex;gap:10px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#act button{background:rgba(20,22,25,.82);font-size:15px;padding:12px 16px}
#toast{position:fixed;z-index:4;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 48px);max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center;color:var(--muted);font-family:var(--f-display);letter-spacing:.06em;pointer-events:none;transition:opacity .6s}
.res{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#toast,#hint{transition:none}}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div class="hp"><div id="hpfill"></div><span id="hptxt"></span></div>
  <div id="timer"></div>
  <div id="bagc"></div>
</div>
<div id="act" hidden><button id="bHeal" type="button">Soin</button><button id="bBag" type="button">Sac</button></div>
<div id="hint" hidden>Glisse pour bouger · Arrête-toi pour tirer</div>
<div id="toast"></div>
<div id="stash" class="screen"></div>
<div id="bag" class="screen over" hidden></div>
<div id="end" class="screen" hidden></div>

<script>
const ITEMS={
  scrap:{n:"Ferraille",t:"val",r:0,v:15,s:1},
  wires:{n:"Câbles en cuivre",t:"val",r:0,v:25,s:1},
  batt:{n:"Piles",t:"val",r:0,v:30,s:1},
  pills:{n:"Antibiotiques",t:"val",r:1,v:80,s:1},
  watch:{n:"Montre",t:"val",r:1,v:95,s:1},
  hdd:{n:"Disque dur",t:"val",r:1,v:120,s:1},
  gpu:{n:"Carte graphique",t:"val",r:2,v:360,s:2},
  gold:{n:"Lingot d'or",t:"val",r:2,v:420,s:1},
  key:{n:"Clé chiffrée",t:"val",r:3,v:900,s:1},
  proto:{n:"Prototype",t:"val",r:3,v:1300,s:2},
  med:{n:"Trousse de soin",t:"med",r:1,v:60,s:1},
  rusty:{n:"Pistolet rouillé",t:"wpn",r:0,v:0,s:2,dmg:10,rate:2,range:260,spr:.07,pel:1,noise:300},
  p9:{n:"Pistolet 9 mm",t:"wpn",r:0,v:120,s:2,dmg:14,rate:2.8,range:300,spr:.05,pel:1,noise:320},
  smg:{n:"PM compact",t:"wpn",r:1,v:380,s:2,dmg:8,rate:8,range:250,spr:.13,pel:1,noise:380},
  sg:{n:"Fusil à pompe",t:"wpn",r:1,v:450,s:2,dmg:9,rate:1.1,range:200,spr:.3,pel:6,noise:460},
  ar:{n:"Fusil d'assaut",t:"wpn",r:2,v:900,s:2,dmg:17,rate:5,range:360,spr:.05,pel:1,noise:480},
  dmr:{n:"Fusil de précision",t:"wpn",r:3,v:1400,s:2,dmg:60,rate:1.2,range:520,spr:.01,pel:1,noise:560},
  vest1:{n:"Gilet léger",t:"arm",r:1,v:220,s:2,red:.2},
  vest2:{n:"Gilet lourd",t:"arm",r:2,v:700,s:2,red:.4},
};
const SHOP=["p9","smg","sg","vest1","med"];
const RAR=["Commun","Peu commun","Rare","Épique"];
const CAP=10, W=2400, H=2400, RAID_TIME=240, KEY="zone-grise-save";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mk=k=>({k,u:uid()});
const price=k=>Math.round(ITEMS[k].v*1.6);
const bagUsed=b=>b.reduce((s,i)=>s+ITEMS[i.k].s,0);
const fmtM=px=>Math.round(px/10)+" m";
function desc(k){const d=ITEMS[k];
  if(d.t==="wpn") return `${d.pel>1?d.pel+"×":""}${d.dmg} dég · ${String(d.rate).replace(".",",")} tirs/s · portée ${fmtM(d.range)}`;
  if(d.t==="arm") return `−${d.red*100} % de dégâts subis`;
  if(d.t==="med") return "Rend 50 PV";
  return RAR[d.r];}

/* ---------- save ---------- */
const fresh=()=>({credits:250,stash:[],lo:{w:null,a:null,meds:0},st:{raids:0,ext:0,dead:0,best:0}});
let S=fresh(), dbRef=null, chain=Promise.resolve(), mode="stash";
function valid(s){return s&&Array.isArray(s.stash)&&s.lo&&s.st&&typeof s.credits==="number"}
try{const l=JSON.parse(localStorage.getItem(KEY)); if(valid(l)) S=l;}catch(e){}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){const snap=JSON.stringify(S); chain=chain.then(()=>dbRef.set({save:snap,at:Date.now()})).catch(()=>{});}
}
(async()=>{try{
  if(!window.claude||!window.claude.use) return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  dbRef=db.collection("data/users/"+id).doc("save");
  const snap=await dbRef.get();
  if(snap.exists){const s=JSON.parse(snap.data().save); if(valid(s)&&mode!=="raid"){S=s; renderStash();}}
  else save();
  if(mode==="stash") renderStash();
}catch(e){}})();

/* ---------- stash ---------- */
function row(it,btns,extra=""){const d=ITEMS[it.k];
  return `<div class="item"><div class="nm"><b style="color:var(--r${d.r})">${d.n}</b><small>${extra||desc(it.k)}</small></div>${btns}</div>`;}
function renderStash(){
  mode="stash";
  const lo=S.lo, meds=S.stash.filter(i=>i.k==="med").length;
  const others=S.stash.filter(i=>i.k!=="med").sort((a,b)=>ITEMS[b.k].v-ITEMS[a.k].v);
  const stashVal=S.stash.reduce((s,i)=>s+ITEMS[i.k].v,0);
  $("stash").innerHTML=`<div class="wrap">
    <div class="top"><div><div class="lbl">Planque</div><h1>Zone Grise</h1></div>
      <div style="text-align:right"><div class="lbl">Crédits</div><div class="cr">${S.credits} cr</div></div></div>
    <div class="card"><div class="lbl">Ce que tu emportes</div>
      ${lo.w?row(lo.w,`<div class="btns"><button data-a="unw">Retirer</button></div>`):row({k:"rusty"},"","Kit gratuit, donné si tu n'as pas d'arme")}
      ${lo.a?row(lo.a,`<div class="btns"><button data-a="una">Retirer</button></div>`):`<div class="item"><div class="nm"><b>Pas de gilet</b><small>Dégâts subis normaux</small></div></div>`}
      <div class="item"><div class="nm"><b>Trousses de soin : ${lo.meds} / 3</b><small>${meds} en planque</small></div>
        <div class="btns"><button data-a="medm" ${lo.meds?"":"disabled"} aria-label="Laisser une trousse">−</button><button data-a="medp" ${meds&&lo.meds<3?"":"disabled"} aria-label="Prendre une trousse">+</button></div></div>
      <p class="note">Si tu meurs, tu perds tout ce qui est ici et tout ce qu'il y a dans ton sac.</p>
    </div>
    <button class="go" data-a="raid">Partir en raid</button>
    <div class="card"><div class="top"><div class="lbl">Planque · ${S.stash.length} objets</div><div class="val">${stashVal} cr</div></div>
      ${others.length?others.map(i=>row(i,`<div class="btns">${ITEMS[i.k].t==="wpn"||ITEMS[i.k].t==="arm"?`<button data-a="eq" data-u="${i.u}">Équiper</button>`:""}<button data-a="sell" data-u="${i.u}">${ITEMS[i.k].v} cr</button></div>`)).join("")
        :`<p class="empty">Rien pour l'instant. Le loot ramené d'un raid arrive ici.</p>`}
      ${meds?row({k:"med"},`<div class="btns"><button data-a="sellmed">${ITEMS.med.v} cr</button></div>`,`${meds} en stock · Rend 50 PV`):""}
    </div>
    <div class="card"><div class="lbl">Marchand</div>
      ${SHOP.map(k=>row({k},`<div class="btns"><button data-a="buy" data-k="${k}" ${S.credits>=price(k)?"":"disabled"}>${price(k)} cr</button></div>`)).join("")}
    </div>
    <p class="note">${S.st.raids} raids · ${S.st.ext} extractions · ${S.st.dead} morts · meilleur butin ${S.st.best} cr · sauvegarde ${dbRef?"liée à ton compte":"sur cet appareil"} · graphismes Kenney (CC0)</p>
  </div>`;
}
$("stash").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const a=b.dataset.a, lo=S.lo, take=u=>{const i=S.stash.findIndex(x=>x.u===u); return i<0?null:S.stash.splice(i,1)[0]};
  if(a==="raid") return startRaid();
  if(a==="unw"){S.stash.push(lo.w); lo.w=null}
  if(a==="una"){S.stash.push(lo.a); lo.a=null}
  if(a==="medp"){const it=S.stash.find(i=>i.k==="med"); if(it){take(it.u); lo.meds++}}
  if(a==="medm"&&lo.meds){lo.meds--; S.stash.push(mk("med"))}
  if(a==="eq"){const it=take(b.dataset.u); if(it){const slot=ITEMS[it.k].t==="wpn"?"w":"a"; if(lo[slot]) S.stash.push(lo[slot]); lo[slot]=it}}
  if(a==="sell"){const it=take(b.dataset.u); if(it) S.credits+=ITEMS[it.k].v}
  if(a==="sellmed"){const it=S.stash.find(i=>i.k==="med"); if(it){take(it.u); S.credits+=ITEMS.med.v}}
  if(a==="buy"){const k=b.dataset.k; if(S.credits>=price(k)){S.credits-=price(k); S.stash.push(mk(k))}}
  save(); renderStash();
});

/* ---------- canvas ---------- */
const cv=$("cv"), ctx=cv.getContext("2d");
const css=getComputedStyle(document.documentElement), C={};
["ground","wall","wall-top","fg","muted","accent","ok","bad","enemy2","r0","r1","r2","r3","line"].forEach(k=>C[k]=css.getPropertyValue("--"+k).trim());
let dpr=1, vw=0, vh=0, zoom=1;
const shade=document.createElement("canvas"), sg=shade.getContext("2d");
function resize(){dpr=Math.min(2,window.devicePixelRatio||1); vw=innerWidth; vh=innerHeight; cv.width=shade.width=vw*dpr; cv.height=shade.height=vh*dpr; zoom=Math.min(1,Math.min(vw,vh)/560)}
addEventListener("resize",resize); resize();

/* ---------- input ---------- */
let js=null; const keys={};
cv.addEventListener("pointerdown",e=>{if(mode!=="raid"||js) return; js={id:e.pointerId,bx:e.clientX,by:e.clientY,x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); hideHint()});
cv.addEventListener("pointermove",e=>{if(js&&e.pointerId===js.id){js.x=e.clientX; js.y=e.clientY}});
const endJs=e=>{if(js&&e.pointerId===js.id) js=null};
cv.addEventListener("pointerup",endJs); cv.addEventListener("pointercancel",endJs);
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true; if(mode==="raid"&&(e.key==="Escape"||e.key.toLowerCase()==="b")) openBag(); else if(mode==="bag"&&(e.key==="Escape"||e.key.toLowerCase()==="b")) closeBag(); if(mode==="raid") hideHint()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="raid") openBag()});
function moveVec(){
  let x=0,y=0;
  if(js){x=(js.x-js.bx)/55; y=(js.y-js.by)/55}
  if(keys.w||keys.z||keys.arrowup) y-=1; if(keys.s||keys.arrowdown) y+=1;
  if(keys.a||keys.q||keys.arrowleft) x-=1; if(keys.d||keys.arrowright) x+=1;
  const l=Math.hypot(x,y); if(l<.18) return {x:0,y:0}; if(l>1){x/=l; y/=l} return {x,y};
}

/* ---------- geometry ---------- */
let R=null;
function segHits(x1,y1,x2,y2,r){let t0=0,t1=1; const dx=x2-x1,dy=y2-y1, p=[-dx,dx,-dy,dy], q=[x1-r.x,r.x+r.w-x1,y1-r.y,r.y+r.h-y1];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0) return false} else {const t=q[i]/p[i]; if(p[i]<0){if(t>t1) return false; if(t>t0) t0=t} else {if(t<t0) return false; if(t<t1) t1=t}}} return true}
const los=(a,b)=>!R.walls.some(w=>segHits(a.x,a.y,b.x,b.y,w));
const inWall=(x,y,pad=0)=>R.walls.some(w=>x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad);
function collide(o,r){for(const w of R.walls){const cx=clamp(o.x,w.x,w.x+w.w), cy=clamp(o.y,w.y,w.y+w.h); let dx=o.x-cx, dy=o.y-cy; const d2=dx*dx+dy*dy;
  if(d2<r*r){if(d2===0){const l=o.x-w.x, rr=w.x+w.w-o.x, t=o.y-w.y, b=w.y+w.h-o.y, m=Math.min(l,rr,t,b); if(m===l) o.x=w.x-r; else if(m===rr) o.x=w.x+w.w+r; else if(m===t) o.y=w.y-r; else o.y=w.y+w.h+r}
    else {const d=Math.sqrt(d2); o.x+=dx/d*(r-d); o.y+=dy/d*(r-d)}}}}
function freePt(pad,ok=()=>true){for(let i=0;i<800;i++){const x=rnd(80,W-80), y=rnd(80,H-80); if(!inWall(x,y,pad)&&ok(x,y)) return {x,y}} return {x:W/2,y:H/2}}
const depth=(x,y)=>clamp(1-Math.hypot(x-W/2,y-H/2)/(W*.62),0,1);
function rollItem(d){
  const x=Math.random(); let r=x<.02+.1*d?3:x<.1+.28*d?2:x<.42+.2*d?1:0;
  const tr=Math.random(), t=tr<.62?"val":tr<.76?"med":tr<.9?"wpn":"arm";
  if(t==="med") return mk("med");
  for(let k=r;k>=0;k--){const c=Object.keys(ITEMS).filter(id=>ITEMS[id].t===t&&ITEMS[id].r===k&&id!=="rusty"); if(c.length) return mk(pick(c))}
  return mk(pick(Object.keys(ITEMS).filter(id=>ITEMS[id].t===t&&id!=="rusty")));
}

/* ---------- raid ---------- */
function spawnEnemy(x,y,aggro=false){const gun=Math.random()<.32; R.enemies.push({x,y,gun,hp:gun?55:42,max:gun?55:42,aggro,wx:0,wy:0,wt:0,cd:rnd(.5,1.5),hit:0})}
function startRaid(){
  R={walls:[],crates:[],enemies:[],bullets:[],ebul:[],pick:[],exits:[],parts:[],cas:[],bag:[],t:RAID_TIME,spawnT:24,ext:0,toastT:0,shake:0,flash:0};
  R.walls.push({x:-40,y:-40,w:W+80,h:40},{x:-40,y:H,w:W+80,h:40},{x:-40,y:0,w:40,h:H},{x:W,y:0,w:40,h:H});
  for(let i=0;i<60;i++){const x=rnd(100,W-300), y=rnd(100,H-300), k=Math.random();
    if(k<.35) R.walls.push({x,y,w:rnd(140,340),h:26}); else if(k<.7) R.walls.push({x,y,w:26,h:rnd(140,340)}); else R.walls.push({x,y,w:rnd(70,170),h:rnd(70,170)})}
  R.decal=makeDecal(); R.ground=SPR.ready?makeGround():null; R.decor=SPR.ready?makeDecor():[];
  const e1=freePt(70,(x,y)=>Math.min(x,y,W-x,H-y)<260);
  const e2=freePt(70,(x,y)=>Math.min(x,y,W-x,H-y)<260&&Math.hypot(x-e1.x,y-e1.y)>1400);
  R.exits=[e1,e2];
  const sp=freePt(30,(x,y)=>Math.min(...R.exits.map(e=>Math.hypot(x-e.x,y-e.y)))>1100);
  const wpn=S.lo.w||mk("rusty");
  R.p={x:sp.x,y:sp.y,hp:100,max:100,cd:0,face:0,wpn,arm:S.lo.a,meds:S.lo.meds,hit:0,still:0};
  for(let i=0;i<18;i++){const c=freePt(30,(x,y)=>Math.hypot(x-sp.x,y-sp.y)>260); R.crates.push({x:c.x,y:c.y,d:depth(c.x,c.y),open:false,prog:0})}
  for(let i=0;i<11;i++){const c=freePt(24,(x,y)=>Math.hypot(x-sp.x,y-sp.y)>480); spawnEnemy(c.x,c.y)}
  S.st.raids++; save();
  mode="raid"; js=null;
  $("stash").hidden=true; $("end").hidden=true; $("hud").hidden=false; $("act").hidden=false;
  const h=$("hint"); h.hidden=false; h.style.opacity=1; setTimeout(hideHint,5000);
  updHud(); last=performance.now();
}
function hideHint(){$("hint").style.opacity=0}

function update(dt){
  const p=R.p, m=moveVec(), moving=m.x!==0||m.y!==0, wd=ITEMS[p.wpn.k];
  p.x+=m.x*175*dt; p.y+=m.y*175*dt; collide(p,13);
  if(moving) p.face=Math.atan2(m.y,m.x);
  p.still=moving?0:p.still+dt; p.cd-=dt; p.hit-=dt; R.shake-=dt;
  for(const c of R.crates){if(c.open) continue; const near=Math.hypot(c.x-p.x,c.y-p.y)<48;
    c.prog=near&&!moving?c.prog+dt:0;
    if(c.prog>=.8){c.open=true; const n=1+Math.floor(Math.random()*2)+(c.d>.55?1:0);
      for(let i=0;i<n;i++){const a=rnd(0,6.28); R.pick.push({x:c.x+Math.cos(a)*24,y:c.y+Math.sin(a)*24,it:rollItem(c.d)})} burst(c.x,c.y,C.accent,10,80)}}
  if(!moving&&p.still>.08&&p.cd<=0){
    let best=null,bd=wd.range;
    for(const e of R.enemies){const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<bd&&los(p,e)){bd=d; best=e}}
    if(best){const a0=Math.atan2(best.y-p.y,best.x-p.x); p.face=a0; p.cd=1/wd.rate;
      for(let i=0;i<wd.pel;i++){const a=a0+rnd(-wd.spr,wd.spr), sp=680; R.bullets.push({x:p.x+Math.cos(a)*16,y:p.y+Math.sin(a)*16,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:wd.range/sp*1.1,dmg:wd.dmg})}
      burst(p.x+Math.cos(a0)*18,p.y+Math.sin(a0)*18,C.accent,3,60,true); noise(p.x,p.y,wd.noise); R.flash=.07;
      const ea=a0+1.57+rnd(-.3,.3), es=rnd(90,150); R.cas.push({x:p.x,y:p.y,vx:Math.cos(ea)*es,vy:Math.sin(ea)*es,r:rnd(0,6.28),vr:rnd(-18,18)})}}
  R.flash-=dt;
  for(let i=R.cas.length-1;i>=0;i--){const s=R.cas[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.r+=s.vr*dt; const f=Math.pow(.015,dt); s.vx*=f; s.vy*=f; s.vr*=f;
    if(Math.hypot(s.vx,s.vy)<6){const g=R.decal.g; g.save(); g.translate(s.x,s.y); g.rotate(s.r); g.fillStyle="#9c7a35"; g.fillRect(-3,-1.2,6,2.4); g.restore(); R.cas.splice(i,1)}}
  for(let i=R.pick.length-1;i>=0;i--){const k=R.pick[i], d=Math.hypot(k.x-p.x,k.y-p.y);
    if(k.nop){if(d>52) k.nop=false; continue}
    if(d<26){const s=ITEMS[k.it.k].s; if(bagUsed(R.bag)+s<=CAP){R.bag.push(k.it); R.pick.splice(i,1); toast("+ "+ITEMS[k.it.k].n); updHud()} else if(R.toastT<=0){toast("Sac plein : ouvre le sac pour jeter un objet"); R.toastT=2.5}}}
  R.toastT-=dt;
  for(const e of R.enemies){
    const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy); e.cd-=dt; e.hit-=dt;
    if(!e.aggro&&d<250&&los(e,p)) e.aggro=true;
    if(e.aggro&&d>950) e.aggro=false;
    let vx=0,vy=0;
    if(!e.aggro){e.wt-=dt; if(e.wt<=0){const a=rnd(0,6.28); e.wx=Math.cos(a); e.wy=Math.sin(a); e.wt=rnd(1.5,4); if(Math.random()<.4){e.wx=0; e.wy=0}} vx=e.wx*40; vy=e.wy*40}
    else if(!e.gun){vx=dx/d*118; vy=dy/d*118; if(d<29&&e.cd<=0){hurt(12); e.cd=.8}}
    else {const see=los(e,p);
      if(!see||d>320){vx=dx/d*85; vy=dy/d*85} else if(d<190){vx=-dx/d*70; vy=-dy/d*70}
      if(see&&d<400&&e.cd<=0){const a=Math.atan2(dy,dx)+rnd(-.08,.08); R.ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*290,vy:Math.sin(a)*290,life:1.6,dmg:9}); e.cd=rnd(1.3,1.8)}}
    e.x+=vx*dt; e.y+=vy*dt;
    for(const o of R.enemies){if(o===e) continue; const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy); if(od>0&&od<28){e.x+=ox/od*(28-od)/2; e.y+=oy/od*(28-od)/2}}
    collide(e,14);
  }
  for(let i=R.bullets.length-1;i>=0;i--){const b=R.bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||inWall(b.x,b.y)){R.bullets.splice(i,1); continue}
    const e=R.enemies.find(e=>Math.hypot(e.x-b.x,e.y-b.y)<15);
    if(e){e.hp-=b.dmg; e.hit=.1; e.aggro=true; R.bullets.splice(i,1); burst(b.x,b.y,C.bad,4,90); blood(b.x+b.vx*.02,b.y+b.vy*.02,3,false);
      if(e.hp<=0){R.enemies.splice(R.enemies.indexOf(e),1); burst(e.x,e.y,C.bad,14,160); blood(e.x,e.y,14,true); if(Math.random()<.45) R.pick.push({x:e.x,y:e.y,it:rollItem(depth(e.x,e.y))})}}}
  for(let i=R.ebul.length-1;i>=0;i--){const b=R.ebul[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||inWall(b.x,b.y)){R.ebul.splice(i,1); continue}
    if(Math.hypot(b.x-p.x,b.y-p.y)<14){R.ebul.splice(i,1); hurt(b.dmg); if(mode!=="raid") return}}
  for(let i=R.parts.length-1;i>=0;i--){const q=R.parts[i]; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=.9; q.vy*=.9; q.life-=dt; if(q.life<=0) R.parts.splice(i,1)}
  if(R.exits.some(e=>Math.hypot(e.x-p.x,e.y-p.y)<62)){R.ext+=dt; if(R.ext>=3) return endRaid(true)} else R.ext=0;
  R.t-=dt; if(R.t<=0) return endRaid(false,"Temps écoulé : la zone a été verrouillée.");
  R.spawnT-=dt; if(R.spawnT<=0){R.spawnT=22; for(let i=0;i<2;i++){const c=freePt(24,(x,y)=>Math.hypot(x-p.x,y-p.y)>600); spawnEnemy(c.x,c.y,R.t<120)}}
  updHud();
}

function endRaid(ok,why){
  const p=R.p; mode="end"; js=null;
  $("hud").hidden=true; $("act").hidden=true; $("hint").hidden=true; $("bag").hidden=true;
  let html;
  if(ok){
    const gained=R.bag.filter(i=>i.k!=="rusty"), val=gained.reduce((s,i)=>s+ITEMS[i.k].v,0);
    S.stash.push(...gained); S.lo.w=p.wpn.k==="rusty"?null:p.wpn; S.lo.a=p.arm; S.lo.meds=p.meds;
    S.st.ext++; S.st.best=Math.max(S.st.best,val);
    html=`<div class="lbl">Extraction réussie</div><h1 style="color:var(--ok)">Sorti vivant</h1><div class="res">+ ${val} cr de butin</div>
      <div class="card">${gained.length?gained.map(i=>row(i,`<span class="val">${ITEMS[i.k].v} cr</span>`)).join(""):`<p class="empty">Sac vide, mais ton équipement est sauf.</p>`}</div>`;
  } else {
    const lost=[...(p.wpn.k!=="rusty"?[p.wpn]:[]),...(p.arm?[p.arm]:[]),...R.bag], val=lost.reduce((s,i)=>s+ITEMS[i.k].v,0)+p.meds*ITEMS.med.v;
    S.lo={w:null,a:null,meds:0}; S.st.dead++;
    html=`<div class="lbl">Raid perdu</div><h1 style="color:var(--bad)">${why}</h1><div class="res">− ${val} cr perdus</div>
      <div class="card">${lost.length||p.meds?lost.map(i=>row(i,`<span class="val">${ITEMS[i.k].v} cr</span>`)).join("")+(p.meds?row({k:"med"},"",p.meds+" trousse(s)"):""):`<p class="empty">Tu n'avais rien à perdre. Le kit gratuit t'attend.</p>`}</div>`;
  }
  save();
  $("end").innerHTML=`<div class="wrap">${html}<button class="go" data-a="home">Retour à la planque</button></div>`;
  $("end").hidden=false;
}

  segs.push([x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]);

function shadow(x,y,r){ctx.fillStyle="rgba(0,0,0,.4)"; ctx.beginPath(); ctx.ellipse(x+4,y+6,r,r*.8,0,0,6.28); ctx.fill()}
function drawCrate(c){ctx.save(); ctx.translate(c.x,c.y); ctx.fillStyle="rgba(0,0,0,.4)"; ctx.fillRect(-11,-9,28,28);
  ctx.fillStyle=c.open?"#3a2f22":"#6b5233"; ctx.fillRect(-14,-14,28,28);
  ctx.strokeStyle=c.open?"#2a2219":"#4a3822"; ctx.lineWidth=2; ctx.strokeRect(-13,-13,26,26);
  if(c.open){ctx.fillStyle="#17130e"; ctx.fillRect(-10,-10,20,20)}
  else {ctx.beginPath(); ctx.moveTo(-13,-13); ctx.lineTo(13,13); ctx.moveTo(13,-13); ctx.lineTo(-13,13); ctx.stroke(); ctx.fillStyle=crateCol(c.d); ctx.fillRect(-14,-14,28,4)}
  ctx.restore()}
function drawPerson(x,y,a,body,head,gunLen,hit){shadow(x,y,13); ctx.save(); ctx.translate(x,y); ctx.rotate(a);
  if(gunLen){ctx.fillStyle="#22262a"; ctx.fillRect(4,3,gunLen,5)}
  ctx.fillStyle=hit?"#f4efe4":body; ctx.beginPath(); ctx.ellipse(0,0,10,15,0,0,6.28); ctx.fill();
  ctx.fillStyle=hit?"#f4efe4":head; ctx.beginPath(); ctx.arc(2,0,7,0,6.28); ctx.fill(); ctx.restore()}
function drawZombie(e,a){shadow(e.x,e.y,13); ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(a);
  ctx.fillStyle=e.hit>0?"#f4efe4":"#5b6b46"; ctx.fillRect(4,-12,13,5); ctx.fillRect(4,7,13,5);
  ctx.fillStyle=e.hit>0?"#f4efe4":"#4a3b39"; ctx.beginPath(); ctx.ellipse(0,0,10,15,0,0,6.28); ctx.fill();
  ctx.fillStyle=e.hit>0?"#f4efe4":"#7d8f5e"; ctx.beginPath(); ctx.arc(3,0,7,0,6.28); ctx.fill(); ctx.restore()}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation="source-over"; ctx.fillStyle=C.ground; ctx.fillRect(0,0,cv.width,cv.height);
  if(!R) return;
  const p=R.p, sx=R.shake>0?rnd(-4,4):0, sy=R.shake>0?rnd(-4,4):0;
  const cx=p.x-vw/2/zoom+sx, cy=p.y-vh/2/zoom+sy, k=dpr*zoom, ww=vw/zoom, wh=vh/zoom, tt=performance.now()/1000;
  const world=g=>g.setTransform(k,0,0,k,-cx*k,-cy*k);
  const poly=visPoly(p.x,p.y), seen=o=>Math.hypot(o.x-p.x,o.y-p.y)<VR&&los(p,o);
  const near=R.walls.filter(w=>w.x<cx+ww+20&&w.x+w.w>cx-20&&w.y<cy+wh+20&&w.y+w.h>cy-20);
  world(ctx);
  const spr=SPR.ready&&R.ground, inView=(x,y,m=60)=>x>cx-m&&x<cx+ww+m&&y>cy-m&&y<cy+wh+m;
  if(spr){const i0=clamp(Math.floor(cx/T),0,GN-1), i1=clamp(Math.floor((cx+ww)/T),0,GN-1), j0=clamp(Math.floor(cy/T),0,GN-1), j1=clamp(Math.floor((cy+wh)/T),0,GN-1);
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++) tile(R.ground[j*GN+i],i*T,j*T,T+.6)}
  else {ctx.fillStyle=groundPat; ctx.fillRect(cx,cy,ww,wh)}
  const sx0=clamp(cx,0,W), sy0=clamp(cy,0,H), sx1=clamp(cx+ww,0,W), sy1=clamp(cy+wh,0,H);
  if(sx1>sx0&&sy1>sy0) ctx.drawImage(R.decal.c,sx0/2,sy0/2,(sx1-sx0)/2,(sy1-sy0)/2,sx0,sy0,sx1-sx0,sy1-sy0);
  if(spr) for(const o of R.decor) if(inView(o.x,o.y)){ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.r); tile(o.t,-o.s/2,-o.s/2,o.s); ctx.restore()}
  ctx.fillStyle="rgba(0,0,0,.45)"; for(const w of near) ctx.fillRect(w.x+7,w.y+9,w.w,w.h);
  for(const c of R.crates) if(inView(c.x,c.y)) spr?drawCrateSprite(c):drawCrate(c);
  for(const q of R.pick){ctx.fillStyle=C["r"+ITEMS[q.it.k].r]; ctx.save(); ctx.translate(q.x,q.y+Math.sin(tt*3+q.x)*1.5); ctx.rotate(.785); ctx.fillRect(-6,-6,12,12); ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=2; ctx.strokeRect(-6,-6,12,12); ctx.restore()}
  ctx.fillStyle="#c79a45"; for(const s of R.cas){ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.r); ctx.fillRect(-3,-1.2,6,2.4); ctx.restore()}
  for(const e of R.enemies){if(!seen(e)) continue; const a=Math.atan2(p.y-e.y,p.x-e.x);
    const fa=e.gun||e.aggro?a:Math.atan2(e.wy,e.wx)||0;
    if(spr) sprite(e.gun?"sold":"zomb",e.x,e.y,fa,e.hit>0); else if(e.gun) drawPerson(e.x,e.y,a,"#5a3a30","#c7a27c",18,e.hit>0); else drawZombie(e,fa);
    if(e.hp<e.max){ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(e.x-15,e.y+20,30,4); ctx.fillStyle=C.bad; ctx.fillRect(e.x-15,e.y+20,30*e.hp/e.max,4)}}
  if(p.arm){ctx.strokeStyle=C.r2; ctx.globalAlpha=.6; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,19,0,6.28); ctx.stroke(); ctx.globalAlpha=1}
  if(spr) sprite(wpnPose(p.wpn.k),p.x,p.y,p.face,p.hit>0); else drawPerson(p.x,p.y,p.face,"#3f4a3a","#d9b48a",ITEMS[p.wpn.k].range>350?24:16,p.hit>0);
  for(const q of R.parts) if(!q.glow){ctx.globalAlpha=clamp(q.life*3,0,1); ctx.fillStyle=q.col; ctx.fillRect(q.x-2,q.y-2,4,4)} ctx.globalAlpha=1;
  if(spr){ctx.fillStyle="rgba(12,16,34,.3)"; ctx.fillRect(cx,cy,ww,wh)}
  // darkness: everything outside the line of sight
  sg.setTransform(1,0,0,1,0,0); sg.globalCompositeOperation="source-over"; sg.fillStyle="rgba(4,5,7,.9)"; sg.fillRect(0,0,shade.width,shade.height);
  world(sg); sg.globalCompositeOperation="destination-out";
  const lg=sg.createRadialGradient(p.x,p.y,VR*.3,p.x,p.y,VR); lg.addColorStop(0,"rgba(0,0,0,1)"); lg.addColorStop(1,"rgba(0,0,0,0)");
  sg.fillStyle=lg; polyPath(sg,poly); sg.fill();
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(shade,0,0); world(ctx);
  if(spr){const dg=ctx.createRadialGradient(p.x,p.y,40,p.x,p.y,VR*1.15); dg.addColorStop(0,"rgba(0,0,0,0)"); dg.addColorStop(1,"rgba(0,0,0,.78)");
    for(const w of near){ctx.fillStyle="#c9611f"; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.fillStyle="#474747"; ctx.fillRect(w.x+5,w.y+5,w.w-10,w.h-10);
      ctx.fillStyle="rgba(255,255,255,.06)"; ctx.fillRect(w.x+5,w.y+5,w.w-10,3); ctx.fillStyle=dg; ctx.fillRect(w.x,w.y,w.w,w.h)}}
  const wg=ctx.createRadialGradient(p.x,p.y,30,p.x,p.y,VR*1.15); wg.addColorStop(0,"#56606a"); wg.addColorStop(1,"#1c1f23");
  if(!spr) for(const w of near){ctx.fillStyle=wg; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.fillStyle=wallPat; ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle="rgba(255,255,255,.08)"; ctx.fillRect(w.x,w.y,w.w,3); ctx.fillStyle="rgba(0,0,0,.4)"; ctx.fillRect(w.x,w.y+w.h-4,w.w,4)}
  // light sources
  ctx.globalCompositeOperation="lighter";
  for(const e of R.exits){glow(e.x,e.y,130,C.ok,.32+.1*Math.sin(tt*3))}
  for(const c of R.crates) if(!c.open&&c.d>.36) glow(c.x,c.y,46,crateCol(c.d),.2+.08*Math.sin(tt*2+c.x));
  for(const q of R.pick) glow(q.x,q.y,22,C["r"+ITEMS[q.it.k].r],.45);
  if(R.flash>0){ctx.save(); polyPath(ctx,poly); ctx.clip(); glow(p.x+Math.cos(p.face)*20,p.y+Math.sin(p.face)*20,260,"rgba(255,176,80,1)",.5*R.flash/.07); ctx.restore()}
  ctx.lineCap="round";
  for(const b of R.bullets){ctx.strokeStyle="rgba(255,190,90,.35)"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025); ctx.stroke();
    ctx.strokeStyle="#ffe2a8"; ctx.lineWidth=2; ctx.stroke()}
  for(const b of R.ebul){glow(b.x,b.y,16,C.enemy2,.8); ctx.fillStyle="#ffd0a0"; ctx.beginPath(); ctx.arc(b.x,b.y,3,0,6.28); ctx.fill()}
  for(const q of R.parts) if(q.glow){ctx.globalAlpha=clamp(q.life*3,0,1); ctx.fillStyle=q.col; ctx.fillRect(q.x-2,q.y-2,4,4)} ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over"; ctx.lineCap="butt";
  for(const e of R.exits){ctx.strokeStyle=C.ok; ctx.setLineDash([10,8]); ctx.lineDashOffset=-tt*20; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.x,e.y,62,0,6.28); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=C.ok; ctx.font="600 14px "+FONT; ctx.textAlign="center"; ctx.fillText("SORTIE",e.x,e.y+5)}
  for(const e of R.enemies) if(e.aggro&&seen(e)){ctx.fillStyle=C.bad; ctx.font="700 16px "+FONT; ctx.textAlign="center"; ctx.fillText("!",e.x,e.y-24)}
  const ring=(x,y,f,col)=>{ctx.strokeStyle=col; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(x,y,24,-1.57,-1.57+6.28*f); ctx.stroke()};
  for(const c of R.crates) if(!c.open&&c.prog>0) ring(c.x,c.y,c.prog/.8,C.accent);
  if(R.ext>0){ring(p.x,p.y,R.ext/3,C.ok); ctx.fillStyle=C.ok; ctx.textAlign="center"; ctx.font="600 15px "+FONT; ctx.fillText("EXTRACTION "+Math.ceil(3-R.ext),p.x,p.y-34)}
  // screen-space overlays
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const low=p.hp/p.max<.35, hurtA=Math.max(p.hit>0?.5:0,low?.25+.15*Math.sin(tt*5):0);
  const vg=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.35,vw/2,vh/2,Math.max(vw,vh)*.75);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,hurtA?`rgba(120,10,10,${hurtA.toFixed(2)})`:"rgba(0,0,0,.45)"); ctx.fillStyle=vg; ctx.fillRect(0,0,vw,vh);
  const top=60, bot=vh-90;
  for(const e of R.exits){const ex=(e.x-cx)*zoom, ey=(e.y-cy)*zoom; if(ex>0&&ex<vw&&ey>top&&ey<bot) continue;
    const a=Math.atan2(ey-vh/2,ex-vw/2), hx=clamp(vw/2+Math.cos(a)*vw,28,vw-28), hy=clamp(vh/2+Math.sin(a)*vh,top+20,bot);
    ctx.save(); ctx.translate(hx,hy); ctx.rotate(a); ctx.fillStyle=C.ok; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9); ctx.fill(); ctx.restore();
    ctx.fillStyle=C.ok; ctx.font="600 12px "+FONT; ctx.textAlign="center"; ctx.fillText(fmtM(Math.hypot(e.x-p.x,e.y-p.y)),hx-Math.cos(a)*30,hy-Math.sin(a)*22+4)}
  if(js&&mode==="raid"){const m=moveVec(); ctx.strokeStyle=C.fg; ctx.globalAlpha=.3; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(js.bx,js.by,55,0,6.28); ctx.stroke();
    ctx.fillStyle=C.fg; ctx.beginPath(); ctx.arc(js.bx+m.x*55,js.by+m.y*55,22,0,6.28); ctx.fill(); ctx.globalAlpha=1}
}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000); last=now; if(mode==="raid") update(dt); draw(); requestAnimationFrame(frame)}
renderStash(); requestAnimationFrame(frame);
</script>
